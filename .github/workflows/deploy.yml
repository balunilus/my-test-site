name: Drupal 11 AWS Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Code via Rsync to AWS
        run: |
          rsync -avz --delete --no-perms --no-owner --no-group --chmod=D2775,F0664 --exclude='.git*' --exclude='web/sites/default/files/***' --exclude='web/sites/default/settings.php' -e "ssh -i ~/.ssh/id_rsa" ./ ubuntu@${{ secrets.AWS_SERVER_IP }}:/var/www/html/

      - name: Run Drupal Post-Deployment Operations
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.AWS_SERVER_IP }} "cd /var/www/html && composer install --no-dev --optimize-autoloader && ./vendor/bin/dr cache:rebuild && sudo chown -R www-data:www-data /var/www/html/web/sites/default/files 2>/dev/null || true"
