name: Drupal 11 AWS Deployment Pipeline

on:
  push:
    branches:
      - main # మీరు 'main' బ్రాంచ్‌లో పుష్ చేసినప్పుడు మాత్రమే రన్ అవుతుంది

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Code via Rsync to AWS
        run: |
          # vendor మరియు web ఫైళ్లను సురక్షితంగా AWS సర్వర్‌కి పంపడం
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='web/sites/default/files' \
            --exclude='web/sites/default/settings.php' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ubuntu@${{ secrets.AWS_SERVER_IP }}:/var/www/html/

      - name: Run Drupal Post-Deployment Operations
        run: |
          # సర్వర్ లోపల డిపెండెన్సీస్, పర్మిషన్స్ మరియు కాషే క్లియర్ చేయడం
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.AWS_SERVER_IP }} << 'EOF'
            cd /var/www/html
            
            # 1. ప్రొడクション కంపోజర్ రన్ చేయడం
            sudo composer install --no-dev --optimize-autoloader
            
            # 2. ఫైల్స్ ఓనర్‌షిప్‌ను Apache కి మార్చడం
            sudo chown -R www-data:www-data /var/www/html
            
            # 3. డ్రూపల్ 11 కొత్త 'dr' CLI ద్వారా కాషే రీబిల్డ్ చేయడం
            sudo -u www-data ./vendor/bin/dr cache:rebuild
            
            # 4. ఒకవేళ డ్రూపల్ కాన్ఫిగరేషన్ ఇంపోర్ట్ చేయాల్సి వస్తే (Drush ఉంటే):
            # sudo -u www-data ./vendor/bin/drush cim -y
          EOF
